# OMI monitoring: manual CSV in data/raw/omi (DVC) → features → drift → retrain gate.
# Download from Fisconline is local; cloud pulls via DVC and runs the pipeline.
name: omi-monitoring

on:
  workflow_dispatch:
  schedule:
    # Quarterly nudge (still needs CSVs in DVC from a manual download)
    - cron: "0 6 1 1,4,7,10 *"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install DVC
        run: pip install 'dvc[s3]'

      - name: Pull data history
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: dvc pull --force

      - name: Pull cloud ingest inbox
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          INGEST_S3_BUCKET: ${{ secrets.INGEST_S3_BUCKET }}
        run: python -m etl.extract.pull_ingest_inbox -v
        continue-on-error: true

      - name: Require OMI CSV from DVC
        run: |
          shopt -s nullglob
          csvs=(data/raw/omi/*VALORI*.csv data/raw/omi/*VALORI*.CSV data/raw/omi/*.csv)
          if [ ${#csvs[@]} -eq 0 ]; then
            echo "::error::No OMI CSV after dvc pull. Download Forniture OMI locally, dvc add/push data/raw, then re-run."
            exit 1
          fi
          echo "Found ${#csvs[@]} OMI CSV file(s)"

      - name: Load + features
        run: python run_pipeline.py --skip-train -v

      - name: Push data history
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          dvc add data/raw
          dvc add data/processed/features_latest.jsonl
          dvc push

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw.dvc data/processed/features_latest.jsonl.dvc
          if [ -f data/raw/.gitignore ]; then git add data/raw/.gitignore; fi
          git diff --staged --quiet || git commit -m "dvc: update OMI data [skip ci]"
          git push

      - name: Drift report
        run: python -m ml.drift_report -v

      - name: Retrain gate
        run: |
          python -m ml.retrain_check --no-mlflow -v
          status=$(python -c "import json; print(json.load(open('reports/retrain_latest/decision.json')).get('retrain_status'))")
          echo "retrain_status=$status"
          if [ "$status" != "ok" ]; then
            echo "No model commit — status=$status (baseline_latest unchanged)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/baseline_latest/model.joblib \
                  models/baseline_latest/metrics.json \
                  models/baseline_latest/dataset.json
          git diff --staged --quiet && exit 0
          git commit -m "model: retrain baseline_latest [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Export dashboard snapshots
        if: always() && !cancelled()
        run: |
          if [ ! -f reports/retrain_latest/decision.json ] && [ ! -f reports/drift_latest/summary.json ]; then
            echo "No monitoring artifacts — skip snapshot export"
            exit 0
          fi
          python -m dashboard.data -v
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/good_deals_latest.json reports/monitoring_latest.json
          git diff --staged --quiet || git commit -m "dashboard: update public snapshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload monitoring artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omi-monitoring-${{ github.run_id }}
          path: |
            reports/drift_latest/
            reports/retrain_latest/
            reports/good_deals_latest.json
            reports/monitoring_latest.json
            models/baseline_latest/metrics.json
            models/baseline_latest/dataset.json
          if-no-files-found: warn
          retention-days: 14
